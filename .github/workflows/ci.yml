name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Python application tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download repository code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Build container image
        run: docker build --pull -t developer-service:${{ github.sha }} .

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Check Python dependencies
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --file=requirements.txt \
            --package-manager=pip \
            --command=python \
            --severity-threshold=high

      - name: Check application source code
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=high

      - name: Verify container scan policy
        run: |
          echo "Commit: ${GITHUB_SHA}"
          echo "Docker base:"
          head -n 1 Dockerfile

          echo "Policy file:"
          test -f .snyk-container
          cat .snyk-container

          echo "Snyk CLI version:"
          snyk --version

          echo "Parsed policy:"
          snyk policy .snyk-container

      - name: Check container vulnerabilities
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test developer-service:"${GITHUB_SHA}" \
            --file=Dockerfile \
            --severity-threshold=high \
            --policy-path=.snyk-container \
            --json-file-output=snyk-container.json
      
      - name: Show container vulnerability report
        if: failure()
        run: |
          if [ -f snyk-container.json ]; then
            cat snyk-container.json
          fi      

      - name: Start container
        run: |
          docker run -d \
            --name developer-service-ci \
            -p 127.0.0.1:8080:8080 \
            -e APP_VERSION="${GITHUB_SHA}" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            developer-service:"${GITHUB_SHA}"

      - name: Wait for container health
        run: |
          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' developer-service-ci)
            echo "Attempt ${attempt}: ${status}"

            if [ "${status}" = "healthy" ]; then
              exit 0
            fi

            if [ "${status}" = "unhealthy" ]; then
              exit 1
            fi

            sleep 2
          done

          echo "Container did not become healthy in time"
          exit 1

      - name: Verify running release
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          with urllib.request.urlopen(
              "http://127.0.0.1:8080/version", timeout=5
          ) as response:
              assert response.status == 200
              data = json.load(response)

          assert data["service"] == "developer-service"
          assert data["version"] == os.environ["GITHUB_SHA"]
          print("Container serves the expected release:", data["version"])
          PY

      - name: Authenticate to AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::115278085846:role/github-developer-service-push
          aws-region: ap-south-1
          role-session-name: github-ecr-${{ github.run_id }}
          allowed-account-ids: "115278085846"

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws ecr get-login-password --region ap-south-1 |
            docker login \
              --username AWS \
              --password-stdin \
              115278085846.dkr.ecr.ap-south-1.amazonaws.com

      - name: Publish scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REPOSITORY: 115278085846.dkr.ecr.ap-south-1.amazonaws.com/developer-service
        run: |
          IMAGE_TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_URI="${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker tag "developer-service:${GITHUB_SHA}" "${IMAGE_URI}"
          docker push "${IMAGE_URI}"

          DIGEST=$(aws ecr describe-images \
            --region ap-south-1 \
            --repository-name developer-service \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [[ "${DIGEST}" != sha256:* ]]; then
            echo "Failed to retrieve the published image digest"
            exit 1
          fi

          echo "Published image: ${IMAGE_URI}"
          echo "Deployment reference: ${ECR_REPOSITORY}@${DIGEST}"

          {
            echo "### Published container"
            echo "- Image: \`${IMAGE_URI}\`"
            echo "- Deployment reference: \`${ECR_REPOSITORY}@${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Show container logs
        if: always()
        run: docker logs developer-service-ci || true

      - name: Remove test container
        if: always()
        run: docker rm -f developer-service-ci || true