name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python application tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download repository code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Build container image
        run: docker build --pull -t developer-service:${{ github.sha }} .

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Check Python dependencies
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --file=requirements.txt \
            --package-manager=pip \
            --command=python \
            --severity-threshold=high

      - name: Check application source code
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=high

      - name: Verify container scan policy
        run: |
          echo "Commit: ${GITHUB_SHA}"
          echo "Docker base:"
          head -n 1 Dockerfile

          echo "Policy file:"
          test -f .snyk-container
          cat .snyk-container

          echo "Snyk CLI version:"
          snyk --version

          echo "Parsed policy:"
          snyk policy .snyk-container

      - name: Check container vulnerabilities
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test developer-service:"${GITHUB_SHA}" \
            --file=Dockerfile \
            --severity-threshold=high \
            --policy-path=.snyk-container \
            --json-file-output=snyk-container.json
      
      - name: Show container vulnerability report
        if: failure()
        run: |
          if [ -f snyk-container.json ]; then
            cat snyk-container.json
          fi      

      - name: Start container
        run: |
          docker run -d \
            --name developer-service-ci \
            -p 127.0.0.1:8080:8080 \
            -e APP_VERSION="${GITHUB_SHA}" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            developer-service:"${GITHUB_SHA}"

      - name: Wait for container health
        run: |
          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' developer-service-ci)
            echo "Attempt ${attempt}: ${status}"

            if [ "${status}" = "healthy" ]; then
              exit 0
            fi

            if [ "${status}" = "unhealthy" ]; then
              exit 1
            fi

            sleep 2
          done

          echo "Container did not become healthy in time"
          exit 1

      - name: Verify running release
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          with urllib.request.urlopen(
              "http://127.0.0.1:8080/version", timeout=5
          ) as response:
              assert response.status == 200
              data = json.load(response)

          assert data["service"] == "developer-service"
          assert data["version"] == os.environ["GITHUB_SHA"]
          print("Container serves the expected release:", data["version"])
          PY

      - name: Show container logs
        if: always()
        run: docker logs developer-service-ci || true

      - name: Remove test container
        if: always()
        run: docker rm -f developer-service-ci || true